services:
  warframe-trade-companion:
    build: .
    image: benjaminkiddie/warframe-trade-companion:latest
    container_name: warframe-trade-companion
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/database.db
    volumes:
      # Mount SQLite database directory for persistence
      - db-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db-data:
    driver: local
