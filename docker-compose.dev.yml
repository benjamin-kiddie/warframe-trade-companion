services:
  warframe-trade-companion-dev:
    build:
      context: .
      target: deps # Only build to the deps stage for development
    container_name: warframe-trade-companion-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:./data/database.db
    volumes:
      # Mount SQLite database directory for persistence
      - db-data-dev:/app/data
    working_dir: /app
    command: >
      sh -c "npx prisma generate &&
             npx prisma migrate dev &&
             npm run dev"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db-data-dev:
    driver: local
